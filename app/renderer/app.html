<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>Earpiece</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="shell">
    <nav class="sidebar" aria-label="Sections">
      <div class="drag sidebar-top"></div>
      <div class="brand">
        <span class="mascot" id="wave" aria-hidden="true"></span>
        <span>Earpiece</span>
      </div>
      <ul class="nav" id="nav">
        <li><button data-section="overview"><svg viewBox="0 0 20 20"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="11" y="3" width="6" height="6" rx="1.5"/><rect x="3" y="11" width="6" height="6" rx="1.5"/><rect x="11" y="11" width="6" height="6" rx="1.5"/></svg>Overview<span class="badge" id="navWaiting" hidden></span></button></li>
        <li><button data-section="agents"><svg viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="10" rx="2"/><path d="M7 17h6M6.5 8l2 1.5-2 1.5M10.5 11h3"/></svg>Agents</button></li>
        <li><button data-section="voice"><svg viewBox="0 0 20 20"><path d="M4 8v4M7 5.5v9M10 3v14M13 5.5v9M16 8v4"/></svg>Voice</button></li>
        <li><button data-section="quiet"><svg viewBox="0 0 20 20"><path d="M15.5 12.5A6.5 6.5 0 0 1 7.5 4.5a6.5 6.5 0 1 0 8 8z"/></svg>Quiet</button></li>
        <li><button data-section="keys"><svg viewBox="0 0 20 20"><circle cx="7" cy="10" r="3.5"/><path d="M10.5 10H17M14.5 10v2.5M16.5 10v2"/></svg>API Keys</button></li>
        <li><button data-section="sync"><svg viewBox="0 0 20 20"><path d="M4 7.5h10.5l-3-3M16 12.5H5.5l3 3"/></svg>Skills &amp; MCP</button></li>
        <li><button data-section="activity"><svg viewBox="0 0 20 20"><path d="M3 10h3l2-5 4 10 2-5h3"/></svg>Activity</button></li>
        <li><button data-section="general"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.5"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>General</button></li>
      </ul>
      <div class="sidebar-foot" id="sideMode"></div>
    </nav>

    <main class="content">
      <header class="drag head">
        <h1 id="title">Overview</h1>
        <div class="head-actions no-drag" id="headActions"></div>
      </header>
      <div class="scroll" id="view" tabindex="-1"></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="logos.js"></script>
  <script src="app.js"></script>
</body>
</html>
