<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
  <title>Earpiece card</title>
  <link rel="stylesheet" href="card.css" />
</head>
<body>
  <!-- The island lives in the notch (or a flat-topped pill at the top centre when there is none).
       At rest it is the Earpiece mark, a count and a status dot either side of the notch; a click
       drops down the panel: what needs you, and your agents. A line peeks it open for a moment,
       then folds it back. -->
  <div class="island" id="card" role="status" aria-live="polite" data-view="gone">
    <span class="shoulder left" aria-hidden="true"></span><span class="shoulder right" aria-hidden="true"></span>

    <div class="clip">
    <div class="rest" id="rest">
      <span class="wing left"><span class="rest-mark" id="restMark"></span><b class="rest-count" id="restCount"></b></span>
      <span class="gap" aria-hidden="true"></span>
      <span class="wing right"><span class="rest-dot" aria-hidden="true"></span></span>
    </div>

    <div class="agents" id="agents" data-tab="needs">
      <div class="agents-head">
        <div class="tabs" role="tablist">
          <button class="tab on" id="tabNeeds" role="tab" title="Questions and finished work (Tab switches)">Needs you <span class="n" id="needsCount" hidden></span></button>
          <button class="tab" id="tabAgents" role="tab" title="Every agent running or recently done (Tab switches)">Agents <span class="m" id="agentsSub"></span></button>
        </div>
        <div class="modes" id="modes" role="group" aria-label="Earpiece mode">
          <button data-mode="on" title="Read lines aloud">On</button>
          <button data-mode="quiet" title="Only “needs you” lines, for an hour">Quiet</button>
          <button data-mode="off" title="Nothing is read aloud">Off</button>
        </div>
      </div>
      <div class="needs" id="needs"></div>
      <div class="agents-tab" id="agentsTab">
        <ul class="rows" id="agentRows"></ul>
        <p class="empty" id="agentsEmpty">No agents running. They show up here as soon as one starts.</p>
      </div>
      <div class="undo" id="undo" hidden><span id="undoText"></span><span class="esc"><kbd>esc</kbd> undo</span><div class="bar"></div></div>
      <p class="err" id="panelErr" hidden></p>
      <div class="agents-foot">
        <span class="keys"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> answer <kbd>J</kbd><kbd>K</kbd> move <kbd>R</kbd> reply <kbd>E</kbd> clear</span>
        <span class="more" id="agentsMore"></span><button class="link" id="openDash">Open dashboard</button>
      </div>
    </div>

    <div class="mini" id="mini">
      <span class="wing left"><span class="mini-logo" id="miniLogo"></span><b class="mini-name" id="miniName"></b></span>
      <span class="gap" aria-hidden="true"></span>
      <span class="wing right">
        <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="dot" aria-hidden="true"></span>
        <span class="count" id="miniCount" hidden></span>
      </span>
    </div>

    <div class="full" id="full">
      <div class="head">
        <div class="avatar" id="avatar"><span class="ring"></span></div>
        <div class="text">
          <div class="meta"><b id="who"></b><span id="project"></span><span class="chip" id="chip" hidden></span></div>
          <p class="line" id="line"></p>
        </div>
        <div class="side">
          <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
          <button class="pill" id="replyBtn" title="Reply to this agent" hidden>Reply</button>
          <button class="btn" id="stop" title="Stop talking" aria-label="Stop talking"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1.5" /></svg></button>
          <button class="btn" id="close" title="Dismiss" aria-label="Dismiss"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" /></svg></button>
        </div>
      </div>
    </div>
    </div>
  </div>
  <script src="logos.js"></script>
  <script src="hold.js"></script>
  <script src="mic.js"></script>
  <script src="panel.js"></script>
  <script src="card.js"></script>
</body>
</html>
